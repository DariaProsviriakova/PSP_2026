<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="black-rectangle"></div>

    <div class="rectangle-spacing1">
        <span class="word-spacing">
            <a href="index.html" class="menu-link">Главная</a>
            Сервисы Планеты Солнце Луна Изображения Видео Необычное Статьи
        </span>
        <div class="theme-switch">
            <button id="themeToggle" class="theme-toggle">
                <span id="themeIcon">🌙</span>
            </button>
            <a href="https://github.com/DariaProsviriakova/PSP_2026" class="contact-link">Контакты</a>
        </div>
    </div>

    <img src="https://hi-news.ru/wp-content/uploads/2020/04/100_stars-750x422.jpg" width="100%" height="400">

    <div class="gray-rectangle">
        <div class="rectangle-spacing2">
            <span class="word-spacing">
                <a href="index.html" class="menu-link">ГЛАВНАЯ</a>
                <a href="calculator.html" class="menu-link">КАЛЬКУЛЯТОР</a>
                НОВОСТИ МКС НЕБО ПЛАНЕТЫ
                <div class="info-dropdown">
                    <a href="info.html" class="info-trigger">ИНФОРМАЦИЯ</a>
                </div>
            </span>
        </div>
    </div>

    <h1>КОСМИЧЕСКИЙ КАЛЬКУЛЯТОР</h1>

    <div class="calculator">
        <div id="result" class="result">0</div>
        <div class="buttons">
            <div>
                <button id="btn_op_clear" class="my-btn secondary">C</button>
                <button id="btn_op_sign" class="my-btn secondary">+/-</button>
                <button id="btn_op_percent" class="my-btn secondary">%</button>
                <button id="btn_op_div" class="my-btn primary">/</button>
                <button id="btn_op_backspace" class="my-btn secondary">⌫</button>
            </div>
            <div>
                <button id="btn_digit_7" class="my-btn">7</button>
                <button id="btn_digit_8" class="my-btn">8</button>
                <button id="btn_digit_9" class="my-btn">9</button>
                <button id="btn_op_mult" class="my-btn primary">x</button>
                <button id="btn_op_sqrt" class="my-btn secondary">√</button>
            </div>
            <div>
                <button id="btn_digit_4" class="my-btn">4</button>
                <button id="btn_digit_5" class="my-btn">5</button>
                <button id="btn_digit_6" class="my-btn">6</button>
                <button id="btn_op_minus" class="my-btn primary">-</button>
                <button id="btn_op_square" class="my-btn secondary">x²</button>
            </div>
            <div>
                <button id="btn_digit_1" class="my-btn">1</button>
                <button id="btn_digit_2" class="my-btn">2</button>
                <button id="btn_digit_3" class="my-btn">3</button>
                <button id="btn_op_plus" class="my-btn primary">+</button>
                <button id="btn_op_factorial" class="my-btn secondary">x!</button>
            </div>
            <div>
                <button id="btn_digit_0" class="my-btn">0</button>
                <button id="btn_digit_dot" class="my-btn">.</button>
                <button id="btn_op_equal" class="my-btn primary execute">=</button>
                <button id="btn_op_triple_zero" class="my-btn secondary">000</button>
                <button id="btn_op_power" class="my-btn secondary">x^y</button>
            </div>
            <div>
                <button id="btn_change_bg_color" class="my-btn secondary">ф</button>
                <button id="btn_change_result_color" class="my-btn secondary">р</button>
            </div>
        </div>
    </div>

    <div class="cosmic-calculator">
        <h1>КОСМИЧЕСКИЕ ВЫЧИСЛЕНИЯ</h1>

        <div class="input-group">
            <label>Массив чисел:</label>
            <input type="text" id="array1" class="cosmic-input" placeholder="Пример: 1, 2, 3, 4" value="1, 2, 3, 4">
        </div>

        <div class="input-group">
            <label>Второй массив:</label>
            <input type="text" id="array2" class="cosmic-input" placeholder="Пример: 2, 4, 6, 8" value="2, 4, 6, 8">
        </div>

        <div class="input-group">
            <label>Вложенный массив:</label>
            <input type="text" id="nestedArray" class="cosmic-input" placeholder="Пример: 1, 2, [3, 4], [5, [6, 7]]"
                value="1, 2, [3, 4], [5, [6, 7]]">
        </div>

        <div class="func-buttons">
            <button class="func-btn" data-func="sumSquares">Сумма квадратов</button>
            <button class="func-btn" data-func="sumProduct">Сумма и произведение</button>
            <button class="func-btn" data-func="diff">Разность массивов</button>
            <button class="func-btn" data-func="flatten">Развернуть массив</button>
        </div>

        <div id="cosmicResult" class="result-area">
            <h3>Результат:</h3>
            <pre>Нажмите на любую функцию выше</pre>
        </div>
    </div>

    <script>
        function sumOfSquares(arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                let square = arr[i] * arr[i];
                sum = sum + square;
            }
            return sum;
        }

        function getSumAndMultOfArray(arr) {
            if (arr.length === 0) return { sum: 0, product: 0 };
            let sum = 0;
            let product = 1;
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i];
                product *= arr[i];
            }
            return { sum, product };
        }

        function diff(arr1, arr2) {
            let result = [];
            for (let i = 0; i < arr1.length; i++) {
                let element = arr1[i];
                let found = false;
                for (let j = 0; j < arr2.length; j++) {
                    if (element === arr2[j]) {
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    result.push(element);
                }
            }
            return result;
        }

        function flatten(arr) {
            let result = [];
            for (let i = 0; i < arr.length; i++) {
                let currentElement = arr[i];
                if (Array.isArray(currentElement)) {
                    let flattenedSubArray = flatten(currentElement);
                    result = result.concat(flattenedSubArray);
                } else {
                    result.push(currentElement);
                }
            }
            return result;
        }

        function parseArray(input) {
            let parts = input.split(',');
            let numbers = [];
            for (let i = 0; i < parts.length; i++) {
                let trimmed = parts[i].trim();
                let number = parseFloat(trimmed);
                if (!isNaN(number)) {
                    numbers.push(number);
                }
            }
            return numbers;
        }

        function parseNestedArray(input) {
            try {
                return JSON.parse(`[${input}]`);
            } catch (e) {
                return input.split(',').map(n => {
                    const trimmed = n.trim();
                    return isNaN(trimmed) ? trimmed : parseFloat(trimmed);
                }).filter(n => n !== '');
            }
        }

        function showResult(text) {
            const resultDiv = document.getElementById('cosmicResult');
            resultDiv.innerHTML = `<h3>Результат:</h3><pre>${text}</pre>`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeIcon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            document.querySelector('[data-func="sumSquares"]').addEventListener('click', () => {
                const input = document.getElementById('array1').value;
                const arr = parseArray(input);
                const result = sumOfSquares(arr);
                showResult(`Функция sumOfSquares([${arr.join(', ')}])\n\nРезультат: ${result}`);
            });

            document.querySelector('[data-func="sumProduct"]').addEventListener('click', () => {
                const input = document.getElementById('array1').value;
                const arr = parseArray(input);
                const result = getSumAndMultOfArray(arr);
                showResult(`Функция getSumAndMultOfArray([${arr.join(', ')}])\n\nСумма = ${result.sum}\nПроизведение = ${result.product}`);
            });

            document.querySelector('[data-func="diff"]').addEventListener('click', () => {
                const input1 = document.getElementById('array1').value;
                const input2 = document.getElementById('array2').value;
                const arr1 = parseArray(input1);
                const arr2 = parseArray(input2);
                const result = diff(arr1, arr2);
                showResult(`Функция diff([${arr1.join(', ')}], [${arr2.join(', ')}])\n\nРезультат: [${result.join(', ')}]`);
            });

            document.querySelector('[data-func="flatten"]').addEventListener('click', () => {
                const input = document.getElementById('nestedArray').value;
                const nested = parseNestedArray(input);
                const result = flatten(nested);
                showResult(`Функция flatten(${JSON.stringify(nested)})\n\nРезультат: [${result.join(', ')}]`);
            });
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeIcon = document.getElementById('themeIcon');
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }
    </script>

    <script type="text/javascript" src="script.js"></script>

    <footer class="footer">
        <p style="text-align: center; margin: 0;">&copy; 2026 Космические планеты. Все права защищены.</p>
    </footer>
</body>

</html>
