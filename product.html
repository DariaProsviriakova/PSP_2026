<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>О планете</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="black-rectangle"></div>

    <div class="rectangle-spacing1">
        <span class="word-spacing">
            <a href="index.html" class="menu-link">Главная</a>
            Сервисы Планеты Солнце Луна Изображения Видео Необычное Статьи
        </span>
        <div class="theme-switch">
            <button id="themeToggle" class="theme-toggle">
                <span id="themeIcon">🌙</span>
            </button>
            <a href="https://github.com/DariaProsviriakova/PSP_2026" class="contact-link">Контакты</a>
        </div>
    </div>

    <img src="https://hi-news.ru/wp-content/uploads/2020/04/100_stars-750x422.jpg" width="100%" height="400">

    <div class="gray-rectangle">
        <div class="rectangle-spacing2">
            <span class="word-spacing">
                <a href="index.html" class="menu-link">ГЛАВНАЯ</a>
                НОВОСТИ МКС НЕБО
                <a href="planets.html" class="menu-link" id="planetsMenuLink" style="color: rgb(138, 43, 226); font-weight: bold;">ПЛАНЕТЫ</a>
                <div class="info-dropdown">
                    <a href="info.html" class="info-trigger">ИНФОРМАЦИЯ</a>
                </div>
            </span>
        </div>
    </div>

    <div class="container my-5" id="product-content">
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeIcon = document.getElementById('themeIcon');
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeIcon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        });

        const planetsData = {
            mars: {
                name: "МАРС",
                title: "Красная планета",
                image: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Mars_-_August_30_2021_-_Flickr_-_Kevin_M._Gill.png",
                text: "Марс — четвёртая планета от Солнца. Названа в честь древнеримского бога войны из-за красного цвета поверхности. На Марсе находится самая высокая гора в Солнечной системе — вулкан Олимп (21 км). Атмосфера Марса состоит в основном из углекислого газа, а температура на поверхности колеблется от -153°C до +20°C. У Марса есть два спутника: Фобос и Деймос."
            },
            jupiter: {
                name: "ЮПИТЕР",
                title: "Газовый гигант",
                image: "https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg",
                text: "Юпитер — самая большая планета Солнечной системы. Его масса в 2,5 раза больше массы всех остальных планет вместе взятых. Юпитер состоит в основном из водорода и гелия. Знаменитое Большое красное пятно — это гигантский шторм, который бушует уже более 300 лет. У Юпитера 79 известных спутников, самый крупный — Ганимед."
            },
            saturn: {
                name: "САТУРН",
                title: "Планета с кольцами",
                image: "https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox_%28rotated%29.jpg",
                text: "Сатурн — шестая планета от Солнца, известная своей системой колец. Кольца состоят из льда и камней. Сатурн — наименее плотная планета: если бы существовал достаточно большой океан, Сатурн мог бы плавать в нём. У Сатурна 82 подтверждённых спутника, самый крупный — Титан, который больше планеты Меркурий."
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const planetId = urlParams.get('planet');
        
        const planet = planetsData[planetId];

        const container = document.getElementById('product-content');
        
        if (planet) {
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-8 mx-auto">
                        <a href="index.html" class="btn btn-secondary mb-4" style="background: var(--btn-bg); color: var(--btn-color);">← Назад к планетам</a>
                        <div class="card" style="background-color: #1a1a2e; color: white; border: 1px solid #667eea;">
                            <img src="${planet.image}" class="card-img-top" alt="${planet.name}" style="max-height: 400px; object-fit: contain; padding: 20px;">
                            <div class="card-body">
                                <h1 class="card-title" style="color: #ffd700; text-align: center;">🪐 ${planet.name}</h1>
                                <h3 style="text-align: center; color: var(--text-primary);">${planet.title}</h3>
                                <p class="card-text lead mt-4" style="font-size: 1.1rem; line-height: 1.6;">${planet.text}</p>
                                <hr style="border-color: #667eea;">
                                <p class="text-muted" style="text-align: center;">Интересный факт: ${planet.name} — одна из самых удивительных планет Солнечной системы!</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-8 mx-auto text-center">
                        <a href="index.html" class="btn btn-secondary mb-4">← Назад</a>
                        <div class="card" style="background-color: #1a1a2e; color: white; padding: 40px;">
                            <h2>Планета не найдена</h2>
                            <p>Вернитесь на главную страницу и выберите планету из списка.</p>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
